# Waypoints in the "map" frame, picked with RViz Publish Point on the map that Nav2
# was running. Run the mission with the SAME map, or the points will be in the wrong
# places. Replace these with the real gamefield coordinates once that map exists.
# Format: NAME: [x, y, yaw]   (metres, metres, radians). Use decimals (0.0, not 0).
#
# A screen            B metallic load    C organic load    D plastic load
# E waiting area      F metallic offload G organic offload H plastic offload
#
# yaw is the direction the robot faces when it arrives (0.0 = along the map's +x axis).
# All 0.0 for now. It matters at A (the camera must face the screen) and at the
# loading/offloading stations (the robot must face the chute / bin). Set each one with:
#   yaw = atan2(target_y - y, target_x - x)
# where (target_x, target_y) is the point the robot should face.
#
# Waypoints that are not defined make the mission fail with a clear message,
# so the robot never drives to a made-up point.
mission_bt:
  ros__parameters:
    waypoints:
      A: [1.11, 2.08, 1.35]
      B: [1.83, 0.22, -0.00]
      C: [1.76, -0.25, 3.07]
      D: [1.03, -0.42, -1.81]
      E: [0.80, 1.09, 2.67]
      F: [1.46, 1.26, -0.16]
      G: [-0.04, 0.05, -0.08]
      H: [1.08, 0.63, 1.54]

      # python3 -c "import math; x,y=-0.03,-1.98; tx,ty=SCREEN_X,SCREEN_Y; print(math.atan2(ty-y, tx-x))"