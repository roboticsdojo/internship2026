/robot_2/controller_manager:
  ros__parameters:
    update_rate: 30
    use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

/robot_2/diff_cont:
  ros__parameters:
    use_sim_time: true
    publish_rate: 50.0

    # NOTE: on Jazzy, diff_drive_controller's cmd_vel input is always
    # geometry_msgs/msg/TwistStamped. Publish stamped Twist to
    # /robot_2/cmd_vel (e.g. teleop_twist_keyboard --ros-args -p stamped:=true).

    base_frame_id: robot_2/base_footprint
    odom_frame_id: robot_2/odom

    left_wheel_names: ['front_left_wheel_joint', 'back_left_wheel_joint']
    right_wheel_names: ['front_right_wheel_joint', 'back_right_wheel_joint']
    wheel_separation: 0.3
    wheel_radius: 0.0425

/robot_2/joint_broad:
  ros__parameters:
    use_sim_time: true