# Mappings to bridge ROS 2 and Gazebo Sim under the robot_2 topology

- ros_topic_name: "/robot_2/scan"
  gz_topic_name: "/robot_2/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot_2/odom"
  gz_topic_name: "/robot_2/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot_2/tf"
  gz_topic_name: "/robot_2/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Global sim clock. Must stay unnamespaced: every node with use_sim_time:true
# subscribes to the global "/clock" topic regardless of its own namespace,
# so bridging it as "/robot_2/clock" means nobody ever receives it.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS