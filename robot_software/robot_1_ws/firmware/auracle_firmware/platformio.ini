; auracle_firmware - Arduino Nano V3.0 (ATmega328P) firmware
;
; This project is laid out so it opens cleanly in BOTH toolchains from the
; exact same files - nothing needs to be copied or renamed between them:
;
;   PlatformIO : open this folder (the one with this platformio.ini) as the
;                project. `pio run` / `pio run -t upload` just works because
;                of the `src_dir` override below.
;   Arduino IDE: File > Open > firmware/auracle_firmware/auracle_firmware/auracle_firmware.ino
;                That inner folder is named exactly like the .ino file
;                (Arduino's hard requirement for a valid sketch), and every
;                .cpp/.h file the sketch needs sits flat alongside it, so the
;                IDE compiles them all automatically - no other setup needed
;                beyond installing the 3 libraries listed below via
;                Sketch > Include Library > Manage Libraries.

[platformio]
; PlatformIO's own default is `src_dir = src`. We point it at the
; Arduino-IDE-compatible folder instead so both tools build the identical
; file set with zero duplication.
src_dir = auracle_firmware

[env:auracle_nano]
platform = atmelavr
; Classic (non-"new") Nano bootloader. If uploading fails with a sync/
; timeout error, your board likely has the newer bootloader - switch to
; `board = nanoatmega328new` instead.
board = nanoatmega328
framework = arduino

; --- Communication Settings ---
; Match this to BAUDRATE in config.h and to the "baud_rate" hardware param
; in ros2_control.xacro / auracle_hardware.
monitor_speed = 115200

; --- Library Dependencies ---
; Arduino IDE users: install these same 3 libraries via Library Manager.
lib_deps =
    # MPU6050 IMU driver
    adafruit/Adafruit MPU6050 @ ^2.2.4
    # Required by Adafruit MPU6050
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    # Required by both Adafruit libraries above for I2C/SPI transport.
    # Listed explicitly rather than left to transitive resolution - PlatformIO's
    # registry doesn't always pull this in automatically, and it's a hard
    # compile failure (missing Adafruit_BusIO_Register.h) without it.
    adafruit/Adafruit BusIO @ ^1.15.0

; --- Build Flags ---
build_flags =
    -D DEBUG_MODE=1

; --- Upload Settings ---
; If uploading to a Nano clone (CH340 USB chip) fails, uncomment and set
; the correct port:
; upload_port = /dev/ttyUSB0
