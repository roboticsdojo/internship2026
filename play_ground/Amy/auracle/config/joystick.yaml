joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.1
    autorepeat_rate: 20.0

teleop_twist_joy:
  ros__parameters:
    publish_stamped_twist: false
    axis_linear:
      x: 1
    scale_linear:
      x: 0.5
    scale_linear_turbo:
      x: 1.0

    axis_angular:
      yaw: 0
    scale_angular:
      yaw: 1.0

    enable_button: 4       # left bumper (LB) - hold to drive
    enable_turbo_button: 5 # right bumper (RB) - hold for turbo speed